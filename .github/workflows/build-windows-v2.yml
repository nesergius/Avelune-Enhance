name: Windows build and validation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate resource manifest
        run: npm run manifest:resources

      - name: Verify resource manifest
        run: npm run verify:resources

      - name: Run automated tests
        run: npm test

  package-windows:
    name: Build Windows artifacts
    needs: validate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate resource manifest
        run: npm run manifest:resources

      - name: Verify resource manifest
        run: npm run verify:resources

      - name: Run automated tests before packaging
        run: npm test

      - name: Build Setup and Portable packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run release:win

      - name: Verify expected Windows artifacts
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          $setup = Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Name -match '^Avelune-Enhance-.+-Setup-x64[.]exe$' }

          $portable = Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Name -match '^Avelune-Enhance-.+-Portable-x64[.]exe$' }

          $blockmap = Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Name -match '^Avelune-Enhance-.+-Setup-x64[.]exe[.]blockmap$' }

          $metadata = Join-Path $PWD 'dist\rc.yml'

          if (@($setup).Count -ne 1) {
            throw "Expected exactly one Setup executable; found $(@($setup).Count)."
          }
          if (@($portable).Count -ne 1) {
            throw "Expected exactly one Portable executable; found $(@($portable).Count)."
          }
          if (@($blockmap).Count -ne 1) {
            throw "Expected exactly one Setup blockmap; found $(@($blockmap).Count)."
          }
          if (-not (Test-Path -LiteralPath $metadata -PathType Leaf)) {
            throw "Expected update metadata is missing: $metadata"
          }

          $signingConfigured =
            -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or
            -not [string]::IsNullOrWhiteSpace($env:CSC_LINK)

          foreach ($file in @($setup[0], $portable[0])) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signingConfigured) {
              if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
                throw "Required Authenticode signature is not valid for $($file.Name), found $($signature.Status)."
              }
              Write-Host "[PASS] Authenticode signature valid: $($file.Name)"
            }
            else {
              if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
                throw "Unsigned release-candidate build expected NotSigned for $($file.Name), found $($signature.Status)."
              }
              Write-Host "[PASS] Unsigned release-candidate artifact: $($file.Name)"
            }
          }

          Write-Host "[PASS] Setup: $($setup[0].Name)"
          Write-Host "[PASS] Portable: $($portable[0].Name)"
          Write-Host "[PASS] Blockmap: $($blockmap[0].Name)"
          Write-Host "[PASS] Metadata: rc.yml"

      - name: Create SHA-256 checksum list
        shell: pwsh
        run: |
          function Get-Sha256([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try {
                $hash = $sha.ComputeHash($stream)
                return (($hash | ForEach-Object { $_.ToString("x2") }) -join "")
              }
              finally {
                $sha.Dispose()
              }
            }
            finally {
              $stream.Dispose()
            }
          }

          $files = Get-ChildItem -LiteralPath dist -File |
            Where-Object {
              $_.Name -match '^Avelune-Enhance-.+-(Setup|Portable)-x64[.]exe$' -or
              $_.Name -match '^Avelune-Enhance-.+-Setup-x64[.]exe[.]blockmap$' -or
              $_.Name -eq 'rc.yml'
            } |
            Sort-Object Name

          if (@($files).Count -lt 4) {
            throw "Expected at least four release files; found $(@($files).Count)."
          }

          $lines = foreach ($file in $files) {
            $hash = Get-Sha256 $file.FullName
            "$hash  $($file.Name)"
          }

          $checksumPath = Join-Path $PWD 'dist\SHA256SUMS.txt'
          $lines | Set-Content -LiteralPath $checksumPath -Encoding ascii
          Get-Content -LiteralPath $checksumPath

      - name: Scan Windows release files with Microsoft Defender
        shell: pwsh
        run: |
          function Get-Sha256([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try {
                $hash = $sha.ComputeHash($stream)
                return (($hash | ForEach-Object { $_.ToString("x2") }) -join "")
              }
              finally {
                $sha.Dispose()
              }
            }
            finally {
              $stream.Dispose()
            }
          }

          function Get-MpCmdRunPath {
            $candidates = @()
            if ($env:ProgramData) {
              $platform = Join-Path $env:ProgramData 'Microsoft\Windows Defender\Platform'
              $candidates += Get-ChildItem -LiteralPath $platform -Filter MpCmdRun.exe -Recurse -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                ForEach-Object { $_.FullName }
            }
            if ($env:ProgramFiles) {
              $candidates += Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
            }
            $command = Get-Command MpCmdRun.exe -ErrorAction SilentlyContinue
            if ($command) {
              $candidates += $command.Source
            }

            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                return $candidate
              }
            }
            throw "MpCmdRun.exe was not found."
          }

          $mpCmd = Get-MpCmdRunPath
          $targets = Get-ChildItem -LiteralPath dist -File |
            Where-Object {
              $_.Name -match '^Avelune-Enhance-.+-(Setup|Portable)-x64[.]exe$' -or
              $_.Name -match '^Avelune-Enhance-.+-Setup-x64[.]exe[.]blockmap$' -or
              $_.Name -eq 'rc.yml' -or
              $_.Name -eq 'SHA256SUMS.txt'
            } |
            Sort-Object Name

          if (@($targets).Count -lt 5) {
            throw "Expected Setup, Portable, blockmap, rc.yml and SHA256SUMS.txt before Defender scan; found $(@($targets).Count)."
          }

          $signatureUpdateOutput = & $mpCmd -SignatureUpdate 2>&1
          $signatureUpdateExitCode = $LASTEXITCODE

          $scanResults = foreach ($file in $targets) {
            $scanOutput = & $mpCmd -Scan -ScanType 3 -File $file.FullName -DisableRemediation 2>&1
            $scanExitCode = $LASTEXITCODE
            [pscustomobject]@{
              Name = $file.Name
              Sha256 = Get-Sha256 $file.FullName
              ExitCode = $scanExitCode
              Passed = $scanExitCode -eq 0
              Output = (($scanOutput | Select-Object -Last 12) -join "`n")
            }
          }

          $report = [ordered]@{
            Scanner = 'Microsoft Defender'
            ScannerPath = $mpCmd
            GeneratedAtUtc = [DateTime]::UtcNow.ToString('o')
            SignatureUpdateExitCode = $signatureUpdateExitCode
            SignatureUpdateOutput = (($signatureUpdateOutput | Select-Object -Last 12) -join "`n")
            Files = @($scanResults)
          }

          $reportPath = Join-Path $PWD 'dist\RC6-DEFENDER-SCAN.json'
          $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $reportPath -Encoding utf8

          $failed = @($scanResults | Where-Object { -not $_.Passed })
          if ($failed.Count -gt 0) {
            throw "Microsoft Defender scan failed for: $((@($failed | ForEach-Object { $_.Name })) -join ', ')"
          }

          Write-Host "[PASS] Microsoft Defender scanned $(@($scanResults).Count) release file(s)."

      - name: Upload Windows build artifact
        id: upload-windows-artifact
        uses: actions/upload-artifact@v7
        with:
          name: avelune-windows-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/Avelune-Enhance-*-Setup-x64.exe
            dist/Avelune-Enhance-*-Portable-x64.exe
            dist/Avelune-Enhance-*-Setup-x64.exe.blockmap
            dist/rc.yml
            dist/SHA256SUMS.txt
            dist/RC6-DEFENDER-SCAN.json

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            Get-ChildItem -LiteralPath dist -File |
              Where-Object {
                $_.Name -match '^Avelune-Enhance-.+-(Setup|Portable)-x64[.]exe$' -or
                $_.Name -match '^Avelune-Enhance-.+-Setup-x64[.]exe[.]blockmap$' -or
                $_.Name -eq 'rc.yml' -or
                $_.Name -eq 'SHA256SUMS.txt'
              } |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )

          if (@($assets).Count -lt 5) {
            throw "Expected Setup, Portable, blockmap, rc.yml and SHA256SUMS.txt before publishing; found $(@($assets).Count)."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --title "Avelune Enhance $tag" `
              --notes-file RC6-RELEASE-NOTES.md `
              --target $env:GITHUB_SHA `
              --prerelease
          }
          else {
            gh release edit $tag `
              --title "Avelune Enhance $tag" `
              --notes-file RC6-RELEASE-NOTES.md `
              --target $env:GITHUB_SHA `
              --prerelease
          }

          gh release upload $tag @assets --clobber

      - name: Report GitHub artifact metadata
        shell: pwsh
        run: |
          Write-Host "Artifact ID: ${{ steps.upload-windows-artifact.outputs.artifact-id }}"
          Write-Host "Artifact URL: ${{ steps.upload-windows-artifact.outputs.artifact-url }}"
          Write-Host "Artifact digest: ${{ steps.upload-windows-artifact.outputs.artifact-digest }}"
